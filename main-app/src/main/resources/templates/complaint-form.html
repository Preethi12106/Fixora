<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Submit Complaint</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container small-container">
    <header class="topbar">
        <h1>Submit Complaint</h1>
        <nav>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/complaints}">View Complaints</a>
            <a th:href="@{/warden}">Warden Dashboard</a>
        </nav>
    </header>

    <div class="card">
        <div th:if="${errorMessage != null}" class="error-message" role="alert">[[${errorMessage}]]</div>
        <form th:action="@{/complaints}" th:object="${complaint}" method="post">
            <div class="form-group">
                <label for="title">Complaint title</label>
                <input id="title" type="text" th:field="*{title}" maxlength="120" placeholder="e.g. Fan not working" required>
                <div class="error" th:if="${#fields.hasErrors('title')}">[[${#fields.errors('title')}]]</div>
            </div>

            <div class="form-group">
                <label for="description">Complaint description</label>
                <textarea id="description" th:field="*{description}" rows="5" maxlength="2000" placeholder="Describe the issue" required></textarea>
                <div class="error" th:if="${#fields.hasErrors('description')}">[[${#fields.errors('description')}]]</div>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" th:field="*{category}" required>
                    <option value="">Select a category</option>
                    <option value="Electrical">Electrical</option>
                    <option value="Plumbing">Plumbing</option>
                    <option value="Cleanliness">Cleanliness</option>
                    <option value="Wi-Fi">Wi-Fi</option>
                    <option value="Other">Other</option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('category')}">[[${#fields.errors('category')}]]</div>
            </div>

            <div class="form-group">
                <label for="roomNumber">Hostel room number</label>
                <input id="roomNumber" type="text" th:field="*{roomNumber}" maxlength="50" placeholder="e.g. 204" required>
                <div class="error" th:if="${#fields.hasErrors('roomNumber')}">[[${#fields.errors('roomNumber')}]]</div>
            </div>

            <div class="button-row">
                <button type="submit" class="button primary">Submit Complaint</button>
                <a class="button secondary" th:href="@{/complaints}">View Complaints</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
